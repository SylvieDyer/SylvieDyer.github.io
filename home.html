<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://kit.fontawesome.com/e50803d88f.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="styles/style.css">

  <title>Sylvie Dyer</title>
</head>

<body>


  <div class="computer">
    <div class="menuBar">
      <div class="icons">
        <i class="fa-solid fa-battery-quarter fa-2x"></i>
        <i class="fa-solid fa-wifi fa-2x"></i>
      </div>
    </div>

    <div class="wallpaper">

      <div class='light x1'></div>
      <div class='light x2'></div>
      <div class='light x3'></div>
      <div class='light x4'></div>
      <div class='light x5'></div>
      <div class='light x6'></div>
      <div class='light x7'></div>
      <div class='light x8'></div>
      <div class='light x9'></div>
    </div>

    <div class="lockScreen">
      <div class="clock">
        <p id="day">Sunday, July 11</p>
        <p id="time">5:11</p>
      </div>

      <div class="login">
        <span id="userCircle">
          <i id="user" class="fa-solid fa-user fa-5x"></i>
        </span>

        <a href="desktop.html">
          <button id="loginText">
            <p id="welcome">
              Sylvie Dyer
            <div id="cursor">|</div>
            </p>
            <span id="nextCircle">
              <i id="arrow" class="fa-solid fa-arrow-right "></i>
            </span>

          </button>
        </a>

      </div>

    </div>

  </div>


</body>

</html>
